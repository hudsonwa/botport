# cargo-deny config: `cargo deny check licenses advisories` (run by scripts/ci.sh; CI installs cargo-deny).
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0"]
confidence-threshold = 0.8

[advisories]
yanked = "deny"
ignore = [
  # unsafe-libyaml is unmaintained (no fix exists); it comes in through serde_yaml, which only parses the user's
  # own local Hermes config files. Replacing serde_yaml is a separate change.
  { id = "RUSTSEC-2024-0449", reason = "unmaintained, no safe upgrade; parses only the user's own local YAML" },
]
