# Port spec for the "Roast My Feed" Grok Bot template demo (SMF Works; see docs/examples/daily-wisdom.md).
# Input: a grok-bot-export v1 file, supplied at run time and never committed (xAI sharing terms), e.g.
#   botport plan --bundle /path/to/roast-my-feed-grok-bot-export.json --spec examples/templates/roast-my-feed/botport.toml
# The base template is generic and made up. Paths are relative to this file's folder.
profile = "tpl-roast-my-feed"
base = "template"
skill_category = "roast-my-feed-grok"
category_description = "Roast My Feed demo skills: {names}."
disable_other_skills = false

[vars]
REPO = "{{SPEC_DIR}}"

[memory_skill]
name = "roast-my-feed-memory"

[soul]
template = "SOUL.md"

[config]
template = "config.yaml"
preserve = []

[user]
seed = "memories/USER.md"
