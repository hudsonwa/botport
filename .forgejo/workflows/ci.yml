name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt, build, clippy, test
        run: scripts/ci.sh
