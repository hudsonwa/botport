[package]
name = "g2h"
version = "0.1.0"
edition = "2021"
description = "botport's talk bridge: Grok Bot <-> Hermes bot direct chat broker (core library)"
license = "MIT"
repository = "https://github.com/hudsonwa/botport"
readme = "README.md"
rust-version = "1.89"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
uuid = { version = "1", features = ["v7"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal", "process"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
unicode-normalization = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
