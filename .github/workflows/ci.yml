name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml runs these same checks before building
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-deny
      - name: fmt, build, clippy, test, cargo-deny (workspace-wide)
        run: scripts/ci.sh
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/*.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"
      - name: shim tests (the integration test skips without the agent-importers source, which CI does not have; the unit tests run)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --quiet pytest pytest-timeout
          echo "::notice::the shim integration test needs the agent-importers source; CI has none, so it is skipped (the unit tests run) (see docs/REFERENCE.md)"
          BOTPORT_BIN=target/debug/botport python -m pytest shim/ --timeout=60 -rs
